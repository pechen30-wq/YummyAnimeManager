name: Build Windows application

on:
  push:
    branches: [main]
    paths:
      - main.py
      - resolvers.py
      - alloha_runtime.py
      - resilient_download.py
      - chapters.py
      - diagnostics.py
      - url_history.py
      - updater.py
      - update_source.py
      - run.bat
      - scripts/build_update_payload.py
      - USER_GUIDE.md
      - requirements.txt
      - VERSION
      - build_exe.bat
      - .github/workflows/build-windows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-application-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          python test_resolvers.py
          python test_plexmatch.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all imageio_ffmpeg --name YummyAnimeManager main.py
      - name: Build update files
        run: python scripts/build_update_payload.py
      - uses: actions/upload-artifact@v4
        with:
          name: YummyAnimeManager-Windows
          path: |
            dist/YummyAnimeManager.exe
            dist/SHA256SUMS.txt
            dist/source.zip
            dist/update.json
      - name: Commit executable
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/YummyAnimeManager.exe
          git add dist/SHA256SUMS.txt
          git add dist/source.zip dist/update.json
          $version = (Get-Content VERSION -Raw).Trim()
          git commit -m "Build Windows EXE $version"
          git pull --rebase origin main
          git push origin main
