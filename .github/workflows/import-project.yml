name: import-project

on:
  push:
    paths:
      - ".import/assemble.flag"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and import project
        shell: bash
        run: |
          set -euo pipefail
          cat .import/parts/*.b64 | base64 -d > project-source.zip
          rm -rf .import-unpack
          mkdir .import-unpack
          unzip -q project-source.zip -d .import-unpack
          cp -a .import-unpack/YummyAnimeManager_project/. ./
          rm -rf .import .import-unpack project-source.zip

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Import YummyAnime Manager 4.2.1"
            git push
          fi
